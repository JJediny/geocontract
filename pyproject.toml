[project]
name = "geocontract-tools"
version = "0.1.0"
description = "Validator, tests, and harvester scaffolding for geocontract ODCS v3.1.0 data contracts."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "CC0-1.0" }
authors = [
  { name = "Permitting Innovation Center", email = "permits@innovation.gov" },
]
keywords = ["data-contract", "odcs", "nepa", "geocontract"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0.2",
  "datacontract-cli>=0.10.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.7",
]

[project.scripts]
geocontract-validate = "geocontract_tools.validate_odcs:main"
geocontract-harvest = "geocontract_tools.harvester:main"

[project.urls]
Homepage = "https://github.com/JJediny/geocontract"
Issues = "https://github.com/JJediny/geocontract/issues"

# ── Build system ─────────────────────────────────────────────────────────────
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geocontract_tools"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["scripts/tests"]
pythonpath = ["scripts", "src"]

# ── ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/tests/*" = ["E402"]
