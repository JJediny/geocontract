# mise.toml — geocontract toolchain
# https://mise.jdx.dev/
#
# One-time setup:
#   mise trust            # accept this file
#   mise install          # install all tools pinned below
#   uv sync               # install Python deps (uv tool)
#
# Then:
#   prek install          # install pre-commit hooks
#   mise run test         # run the full validation suite

[env]
# Disable mise's experimental Tier-2 features we don't use
MISE_DISABLE_TOOL_VERSIONS_FILE = "1"

# ── Tool versions (install via `mise install`) ───────────────────────────────
[tools]
# Python: managed by uv, but mise pins the runtime for scripts
python = "3.13"
# Node: for the json-schema-x-graphql Node converter
node = "22"
# Rust: for vendoring and re-building the json-schema-x-graphql Rust CLI
rust = "1.85"
# System tools required by hooks / validation
"pipx:datacontract-cli" = "0.10.21"
"npm:dprint" = "0.47.5"

# ── Tasks (run with `mise run <name>`) ──────────────────────────────────────
[tasks]

# Validate every ODCS YAML and shim JSON against the geocontract master
# schema (ODCS v3.1.0 + embeddedSchemas extension). The master schema
# is a strict superset of the bare ODCS schema, so every contract that
# validates against ODCS also validates against it. Contracts that use
# the `embeddedSchemas` block (e.g. the DCAT-US catalog contract) ONLY
# validate against the master schema.
validate-odcs = "uv run python scripts/validate_odcs.py --master contracts/*.yaml contracts/examples/*.json && uv run python scripts/validate_odcs.py --shim contracts/shim/*.json"

# Validate every DCAT-US Catalog JSON instance against the pinned GSA
# DCAT-US 3.0.0 schema. Examples live in examples/dcat-us-catalog.example.data.json.
validate-dcat = "uv run python scripts/validate_odcs.py --dcat examples/dcat-us-catalog.example.data.json"

# Cross-validate the bare-ODCS contracts with the upstream datacontract CLI
# (a second-line check; equivalent to `datacontract lint` on each YAML).
# The dcat-us-catalog contract is EXCLUDED because it uses the
# geocontract `embeddedSchemas` extension, which is beyond the bare ODCS
# standard that the upstream CLI validates against — `datacontract lint`
# flags it by design. The authoritative check for that contract is
# `mise run validate-odcs` (which uses the geocontract master schema).
datacontract-lint = "for f in contracts/nepa-exclusions.datacontract.yaml contracts/pic-standards.datacontract.yaml contracts/odcs-v3.1.0-template.yaml; do datacontract lint \"$f\"; done"

# Format every checked-in JSON file with dprint. dprint is installed via
# mise's npm:dprint backend (see [tools]) so the bare `dprint` invocation
# resolves to .local/share/mise/installs/npm-dprint/.../dprint.
fmt = "dprint fmt"
fmt-check = "dprint check"

# Run the Python test suite (validator unit tests).
test = "uv run pytest scripts/tests/ -v"

# End-to-end smoke test: validate, lint, and run pytest.
ci = ["validate-odcs", "datacontract-lint", "fmt-check", "test"]

# Generate GraphQL SDL from the x-graphql-annotated templates using the
# vendored jxql converter. The models/*.canonical.graphql files are build
# artifacts — do not edit them by hand; re-run this task after changing a
# template. Requires `mise run vendor-jxql` to have built jxql once.
generate-graphql = "bash scripts/generate_graphql.sh"

# (Re)build the geocontract master schema from the pinned ODCS v3.1.0
# schema. The master schema adds the `embeddedSchemas` extension point.
# Run after bumping external/odcs-json-schema-v3.1.0.json.
build-master-schema = "uv run python scripts/build_master_schema.py"

# Vendor the json-schema-x-graphql Rust CLI (jxql) into .tools/.
# Run once after `mise install`; subsequent runs are no-ops.
vendor-jxql = "bash scripts/vendor.sh"

# Initialize pre-commit hooks. Idempotent.
prek-install = "prek install"
