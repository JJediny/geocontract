# mise.toml — geocontract toolchain
# https://mise.jdx.dev/
#
# One-time setup:
#   mise trust            # accept this file
#   mise install          # install all tools pinned below
#   uv sync               # install Python deps (uv tool)
#
# Then:
#   prek install          # install pre-commit hooks
#   mise run test         # run the full validation suite

[env]
# Disable mise's experimental Tier-2 features we don't use
MISE_DISABLE_TOOL_VERSIONS_FILE = "1"

# ── Portolan toolchain pins ──────────────────────────────────────────────────
# One canonical home per fact. Tasks and CI read these; never inline a version.
# These mirror portolan-skills/pins.toml (portolan-cli 0.8.0, rashid 0.1.8,
# portolan-spec v0.2.0). Move a pin here and in pins.toml in the same change,
# then run `mise run portolan-pins` to prove the new pin resolves.
#
# The Portolan specification is ground truth; rashid implements it. A rashid
# MINOR bump can change findings, because the spec is pre-1.0 and breaks on
# MINOR. Treat a pin move as a migration: see portolan-skills/skills/
# portolan-migrate/ and docs/portolan-conformance-notes.md.
RASHID_SPEC = "rashid>=0.1.8,<0.2.0"
PORTOLAN_CLI_SPEC = "portolan-cli==0.8.0"
PORTOLAN_SCHEMA_URI = "https://schemas.portolan-sdi.org/portolan/v0.2.0/schema.json"

# ── Tool versions (install via `mise install`) ───────────────────────────────
[tools]
# Python: managed by uv, but mise pins the runtime for scripts
python = "3.13"
# Node: for the json-schema-x-graphql Node converter
node = "22"
# Rust: for vendoring and re-building the json-schema-x-graphql Rust CLI.
# Bumped from 1.85 after jxql's transitive deps (icu_collections 2.2+,
# simd-json 0.18+) started requiring rustc >= 1.86 / 1.88. Vendor-jxql
# would fail on fresh runners with "rustc 1.85.1 is not supported by
# the following packages", which then broke the
# test_generated_graphql_is_reproducible pytest. 1.88 is the minimum
# that satisfies every transitive dep in jxql's lock file.
rust = "1.88"
# System tools required by hooks / validation.
# NOTE: the datacontract CLI is deliberately NOT installed via the mise
# `pipx:` backend. The pinned 0.10.21 release imports `pytz` in
# datacontract/catalog/catalog.py but does not declare it in Requires-Dist,
# so the pipx-installed console script crashes on import (upstream
# packaging bug). The `datacontract-lint` task below runs the CLI through
# `uvx --with pytz` instead, which injects the missing runtime dependency.
"npm:dprint" = "0.47.5"

# ── Tasks (run with `mise run <name>`) ──────────────────────────────────────
[tasks]

# Validate every ODCS YAML and shim JSON against the geocontract master
# schema (ODCS v3.1.0 + embeddedSchemas extension). The master schema
# is a strict superset of the bare ODCS schema, so every contract that
# validates against ODCS also validates against it. Contracts that use
# the `embeddedSchemas` block (e.g. the DCAT-US catalog contract) ONLY
# validate against the master schema.
validate-odcs = "uv run python scripts/validate_odcs.py --master contracts/*.yaml contracts/examples/*.json && uv run python scripts/validate_odcs.py --shim contracts/shim/*.json"

# Validate every DCAT-US Catalog JSON instance against the pinned GSA
# DCAT-US 3.0.0 schema. The instance is generated: run build-dcat first.
validate-dcat = "uv run python scripts/validate_odcs.py --dcat examples/dcat-us-catalog.example.data.json"

# Rebuild examples/dcat-us-catalog.example.data.json from the generated
# Portolan tree (plan §11 item 2). Deterministic: re-running on an
# unchanged tree is byte-for-byte a no-op.
build-dcat = "uv run python scripts/build_dcat.py"

# dcat-check reads catalog/, so it must run AFTER catalog-check has
# finished writing the tree. Without the depends, the parallel
# scheduler lets both read/write catalog/ concurrently and
# build-dcat occasionally catches a half-written collection.json
# with no matching contract yaml (race observed on CI).
dcat-check = { depends = ["build-dcat", "validate-dcat", "catalog-check"] }

# Rebuild the DataCite v4.3 records from the generated Portolan tree
# (issue #21). Deterministic, one record per unique contract id.
build-datacite = "uv run python scripts/build_datacite.py"

validate-datacite = "uv run python scripts/validate_odcs.py --datacite examples/datacite4.3/*.json"

# datacite-check also reads catalog/, so it depends on both
# catalog-check and dcat-check to avoid the same race condition.
datacite-check = { depends = ["build-datacite", "validate-datacite", "dcat-check"] }

# Cross-validate the bare-ODCS contracts with the upstream datacontract CLI
# (a second-line check; equivalent to `datacontract lint` on each YAML).
# The dcat-us-catalog contract is EXCLUDED because it uses the
# geocontract `embeddedSchemas` extension, which is beyond the bare ODCS
# standard that the upstream CLI validates against — `datacontract lint`
# flags it by design. The authoritative check for that contract is
# `mise run validate-odcs` (which uses the geocontract master schema).
datacontract-lint = "for f in contracts/nepa-exclusions.datacontract.yaml contracts/pic-standards.datacontract.yaml contracts/odcs-v3.1.0-template.yaml; do uvx --with pytz --from datacontract-cli==0.10.21 datacontract lint \"$f\"; done"

# Format every checked-in JSON file with dprint. dprint is installed via
# mise's npm:dprint backend (see [tools]) so the bare `dprint` invocation
# resolves to .local/share/mise/installs/npm-dprint/.../dprint.
fmt = "dprint fmt"
fmt-check = "dprint check"

# Run the Python test suite (validator unit tests).
test = "uv run pytest scripts/tests/ -v"

# End-to-end smoke test: validate, lint, and run pytest.
# NOTE: `depends` lists *tasks* to run in order. A bare array value
# (e.g. `ci = ["validate-odcs", ...]`) is treated by mise as shell
# commands to execute, not task references, and fails with
# "validate-odcs: not found".
ci = { depends = ["drift-check", "validate-odcs", "datacontract-lint", "fmt-check", "test", "pipeline-test", "catalog-check", "dcat-check", "datacite-check"] }

# Run the full v2 core pipeline against the committed worked
# example (scripts/tests/test_pipeline_end_to_end.py). Catches
# cross-module regressions in the validate → canonicalise → proof →
# ontology → ODCS-flatten → public-projection → harvest chain.
pipeline-test = "uv run pytest scripts/tests/test_pipeline_end_to_end.py -v"

# Generate GraphQL SDL from the x-graphql-annotated templates using the
# vendored jxql converter. The models/*.canonical.graphql files are build
# artifacts — do not edit them by hand; re-run this task after changing a
# template. The CI workflow runs `mise run vendor-jxql` as a dedicated
# step before this task is invoked (test_generated_graphql_is_reproducible
# calls it via subprocess.run with capture_output=True and would surface
# a Rust build failure as a confusing exit-status-101 panic). Local dev
# gets the same guarantee by running `mise run vendor-jxql` once after
# cloning; vendor.sh is idempotent.
generate-graphql = "bash scripts/generate_graphql.sh"

# (Re)build the geocontract master schema from the pinned ODCS v3.1.0
# schema. The master schema adds the `embeddedSchemas` extension point.
# Run after bumping external/odcs-json-schema-v3.1.0.json.
build-master-schema = "uv run python scripts/build_master_schema.py"

# Vendor the json-schema-x-graphql Rust CLI (jxql) into .tools/.
# Run once after `mise install`; subsequent runs are no-ops.
vendor-jxql = "bash scripts/vendor.sh"

# Harvest one or more citizen-initiated Proposal files into JSONL.
# Public projection is the default (plan §5.8); the restricted
# projection requires --projection=restricted --authority-token <token>.
harvest-citizen = "uv run geocontract-harvest-citizen"

# Harvest a citizen-initiated source-set into a directory (manifest +
# records.jsonl + contracts/). See docs/design-harvester.md §"Pipeline".
harvest-citizen-dir = "uv run geocontract-harvest-citizen-dir"

# Regenerate examples/groton-rhine-002.example.data.json — the
# full-coverage signed worked example. Uses a documented test
# keypair (committed to the repo, marked TEST ONLY); output is
# byte-reproducible for non-timestamp fields.
build-signed-example = [
  "uv run python scripts/build_signed_example.py",
  "dprint fmt examples/groton-rhine-002.example.data.json",
]
# Initialize pre-commit hooks. Idempotent.
prek-install = "prek install"

# ── Portolan catalog tasks ──────────────────────────────────────────────────

# Build the Portolan catalog from the manifest and contracts.
# The generator is deterministic and writes no timestamps, so rebuilding
# an unchanged manifest produces no diff.
catalog-build = "uv run python scripts/build_catalog.py"

# Build the catalog and validate it with rashid.
# This is the full validation gate: build + Portolan conformance check.
catalog-check = "uv run python scripts/build_catalog.py && uvx --from 'rashid>=0.1.8,<0.2.0' rashid check catalog/ --no-data --summary"

# ── Portolan catalog tasks ──────────────────────────────────────────────────

# Prove the pinned Portolan tools resolve and report their versions. Run this
# after moving a pin in [env] above. Downloads on first use, then caches.
portolan-pins = """
uvx --from "$RASHID_SPEC" rashid --version
uvx --from "$PORTOLAN_CLI_SPEC" portolan --version
echo "spec schema: $PORTOLAN_SCHEMA_URI"
"""

# Prove the bundle pins and the mise pins agree (plan §11 item 3).
# Runs first in `ci`: a version mismatch invalidates every documented
# command and finding after it.
drift-check = "uv run python scripts/check_drift.py"

# Calibrate rashid against the specification's own reference catalog. A clean
# run here proves the toolchain works before you trust a finding in our tree.
# Expected: 0 errors, 0 warnings, and PTL-PRO-002 info only.
#
# --no-data is deliberate. The data pass reads every asset's bytes and fetches
# remote hrefs, which makes the run slow and network-dependent for no gain: the
# calibration question is whether the metadata and structural passes work. The
# reference catalog reports the same 16 info findings either way. Verified on
# 3 October 2026 with rashid 0.1.8.
portolan-calibrate = 'uvx --from "$RASHID_SPEC" rashid check portolan-spec/examples/catalog/portolan-reference --no-data --summary'

#
# ── Publishing ────────────────────────────────────────────────────────────

# Publish the catalog to the configured destination (dry run by default).
# Reads catalog.publish.yaml for destination and public_base.
# Use --confirm to actually publish (needs credentials for S3).
# Run through `uv run` so tools/publish.py sees the dev extras
# (pyyaml, httpx, boto3) that `uv sync --extra dev` installs.
publish = "uv run python tools/publish.py"
publish-confirm = "uv run python tools/publish.py --confirm"

# NOTE: `catalog-build` and `catalog-check` arrive with the Phase 1 generator
# (scripts/build_catalog.py). See docs/plan-portolan-catalog-integration.md §7.
# They are deliberately absent here so every task in this file runs today.

# Harvest contracts from various sources (URLs, files, git repos, S3)
# Usage: mise run harvest <source1> <source2> ... [--out .harvest] [--sink jsonl|portolan]
harvest = "uv run python scripts/harvest.py"

# Harvest contracts to Portolan mirror collections
# Usage: mise run harvest-portolan <source1> <source2> ...
harvest-portolan = "uv run python scripts/harvest.py --sink portolan"
