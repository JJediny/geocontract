# geocontract CI — mirrors the local `mise run ci` entrypoint.
#
# Toolchain provisioning:
#   - mise    installs the tools pinned in mise.toml (python 3.13, node 22,
#             rust 1.85, npm:dprint) and provides the task runner.
#   - uv      is NOT mise-managed (it is a system-PATH tool locally), so it
#             is provisioned explicitly here. `uv sync` creates the project
#             venv and `uvx` is what the `datacontract-lint` task uses.
#
# The `datacontract-lint` task fetches `datacontract-cli==0.10.21` plus the
# undeclared `pytz` runtime dependency via `uvx` on first run, so the job
# needs network access (GitHub-hosted runners have it).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (mise run ci)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # actions/checkout@v4 does NOT initialize git submodules by
      # default. The repo vendors the Portolan specification under
      # `portolan-spec/` and the skills bundle under `portolan-skills/`;
      # `scripts/check_drift.py` reads `portolan-skills/pins.toml` and
      # `mise run catalog-build` reads the spec submodule, so we must
      # check them out explicitly with `submodules: recursive`.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          # Provision the mise binary only; tools are installed explicitly
          # below so the trust step is unambiguous.
          install: false
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Trust and install pinned tools
        run: |
          mise trust
          mise install

      # Install both the runtime deps (uv sync) and the dev extras
      # (pytest, pytest-cov, ruff, base58). The `test`, `pipeline-test`,
      # and `fmt-check` mise tasks all need pytest; without --extra dev,
      # `uv run pytest` cannot find pytest in the venv and mise reports
      # "Failed to spawn: pytest" with "No such file or directory".
      - name: Sync Python dependencies (runtime + dev extras)
        run: uv sync --extra dev

      # Build the json-schema-x-graphql Rust CLI once before the
      # validation suite runs. The
      # test_generated_graphql_is_reproducible pytest calls `mise run
      # generate-graphql` via subprocess.run with capture_output=True;
      # if jxql is missing it surfaces as a Rust-panic-shaped exit
      # status 101 with empty captured output, which is hard to
      # diagnose from the test failure alone. Running vendor-jxql here
      # means the test only sees the script's own behaviour.
      # vendor.sh is idempotent, so re-runs on warm caches are fast.
      - name: Vendor jxql (json-schema-x-graphql CLI)
        run: mise run vendor-jxql

      - name: Run the full validation suite
        run: mise run ci

      # Catalog gates: the generated STAC tree must match its inputs
      # (contracts + manifest) and pass the Portolan validator.
      - name: Build catalog
        run: mise run catalog-build

      - name: Check catalog is up to date
        run: |
          if [[ -n "$(git status --porcelain catalog/)" ]]; then
            echo "Error: catalog/ is not up to date. Run 'mise run catalog-build' and commit the changes."
            git status --porcelain catalog/
            exit 1
          fi

      - name: Validate catalog with rashid
        run: mise run catalog-check

      - name: Run publish dry-run
        run: mise run publish
