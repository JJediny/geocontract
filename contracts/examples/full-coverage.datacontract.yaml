# ODCS v3.1.0 Data Contract — Full Field Coverage Example
#
# This contract exists for one purpose: to exercise every primitive and
# every supported sub-field in the canonical ODCS v3.1.0 JSON Schema.
# The validator (`geocontract-validate`) and the upstream `datacontract
# lint` CLI both pass against this file, which means it doubles as a
# regression test for schema additions.
#
# Treat the values as illustrative. The two production contracts
# (`nepa-exclusions.datacontract.yaml` and `pic-standards.datacontract.yaml`)
# are the canonical geocontracts; this file is the reference shape.

apiVersion: v3.1.0
kind: DataContract
id: geocontract-full-coverage-example
name: "ODCS v3.1.0 Full-Coverage Reference Contract"
version: 1.0.0
status: active
tenant: us-federal-geocontract
domain: environmental-review
# Deprecated in v3.1; included here to exercise the field. Will be
# removed in ODCS v4.0.
dataProduct: "Full-coverage reference dataset"

# ── Description (nested object, not a string) ────────────────────────────────
description:
  purpose: "Demonstrate every ODCS v3.1.0 supported field in one place."
  usage: "Reference contract for CI validation; not a real dataset."
  limitations: "Synthetic; do not use in production."
  authoritativeDefinitions:
    - url: "https://bitol-io.github.io/open-data-contract-standard/"
      type: documentation
      description: "ODCS v3.1.0 canonical specification."
  customProperties:
    - property: exampleTier
      value: reference
      description: "Marks this contract as the full-coverage reference."

# ── Tags (top-level + nested) ────────────────────────────────────────────────
tags:
  - geocontract
  - reference
  - full-coverage
  - example

# ── Servers (one per ODCS-recognised kind, exercising every ServerSource) ───
servers:
  # api: needs `location` (URI)
  - server: reference-api
    type: api
    location: "https://api.example.gov/v1"
    environment: production
    description: "Public REST endpoint."

  # local: needs `path` + `format`
  - server: reference-local
    type: local
    path: "./data/example.parquet"
    format: parquet
    environment: production
    description: "Local file-based sample."

  # postgres: needs host, port, database, schema
  - server: reference-postgres
    type: postgres
    host: db.example.gov
    port: 5432
    database: geocontract_examples
    schema: public
    environment: production
    description: "PostgreSQL reference database."

  # kafka: needs host
  - server: reference-kafka
    type: kafka
    host: kafka.example.gov:9092
    format: avro
    environment: production
    description: "Kafka topic reference."

  # s3: needs `location` (s3:// URI)
  - server: reference-s3
    type: s3
    location: "s3://geocontract-reference/example/{model}/*.parquet"
    environment: production
    description: "S3-backed parquet archive."

  # snowflake: host, port, account, database, schema
  - server: reference-snowflake
    type: snowflake
    host: acme.snowflakecomputing.com
    port: 443
    account: acme
    database: REFERENCE
    schema: PUBLIC
    environment: production
    description: "Snowflake warehouse."

  # bigquery: project + dataset
  - server: reference-bigquery
    type: bigquery
    project: acme-geocontract
    dataset: reference
    environment: production
    description: "BigQuery dataset."

  # redshift: host, database, schema, region
  - server: reference-redshift
    type: redshift
    host: acme-redshift.example.gov
    database: reference
    schema: public
    region: us-east-1
    environment: production
    description: "Redshift warehouse."

  # athena: stagingDir + schema
  - server: reference-athena
    type: athena
    stagingDir: "s3://acme-athena-staging/results/"
    schema: reference_db
    catalog: awsdatacatalog
    regionName: us-east-1
    environment: production
    description: "Athena over S3."

  # glue: account + database + location
  - server: reference-glue
    type: glue
    account: "1234-5678-9012"
    database: reference_db
    location: "s3://acme-glue/reference/"
    environment: production
    description: "AWS Glue catalog."

  # custom: catch-all
  - server: reference-custom
    type: custom
    dataset: acme/reference
    delimiter: ","
    environment: production
    description: "Custom integration."

# ── Schema: exercise every primitive type and every quality kind ────────────
schema:
  # ── Object #1: covers logicalType=object with primaryKey, examples,
  # logicalTypeOptions (with format), all quality variants, relationships,
  # customProperties, authoritativeDefinitions, tags, encryptedName,
  # transformSourceObjects, transformLogic, transformDescription,
  # criticalDataElement, partitioned, unique.
  - name: CoverageObject
    physicalName: coverage_object
    logicalType: object
    description: "Reference object exercising every SchemaObject/SchemaProperty primitive."
    dataGranularityDescription: "One row per coverage test case."
    authoritativeDefinitions:
      - url: "https://bitol-io.github.io/open-data-contract-standard/"
        type: documentation
        description: "ODCS v3.1.0 specification."
    tags:
      - reference
      - coverage
    customProperties:
      - property: schemaTier
        value: reference
        description: "Marks this object as a full-coverage example."
    properties:
      - name: id
        primaryKey: true
        primaryKeyPosition: 1
        logicalType: integer
        logicalTypeOptions:
          format: i64
          minimum: 1
        physicalType: BIGINT
        required: true
        unique: true
        partitioned: true
        partitionKeyPosition: 1
        classification: public
        criticalDataElement: true
        description: "Primary key."
        examples:
          - 1
          - 42
          - 2105
        encryptedName: id_encrypted
        transformSourceObjects:
          - source_system_x
          - source_system_y
        transformLogic: "COALESCE(source_x.id, source_y.id)"
        transformDescription: "Pick the first non-null id across sources."
        businessName: "Coverage Object ID"
        authoritativeDefinitions:
          - url: "https://en.wikipedia.org/wiki/Surrogate_key"
            type: documentation
            description: "Surrogate-key definition."
        tags:
          - identifier
          - pii-low
        customProperties:
          - property: indexHint
            value: btree
            description: "PostgreSQL index type."
        # Quality — every variant of DataQuality.
        quality:
          # 1) library metric with operator
          - type: library
            dimension: uniqueness
            metric: duplicateValues
            description: "ids must be globally unique."
            businessImpact: operational
            severity: error
            unit: rows
            schedule: "0 * * * *"
            scheduler: cron
            mustBe: 0
          # 2) sql query
          - type: sql
            dimension: completeness
            description: "No id may be NULL."
            businessImpact: regulatory
            severity: error
            unit: rows
            query: "SELECT COUNT(*) FROM ${table} WHERE ${column} IS NULL"
            mustBe: 0
          # 3) custom (Soda / Great Expectations / Monte Carlo / dbt)
          - type: custom
            dimension: accuracy
            description: "Cross-check id against upstream register."
            businessImpact: operational
            severity: warning
            engine: great-expectations
            implementation:
              expectation_type: expect_column_values_to_be_unique
              column: id
          # 4) text (human-readable)
          - type: text
            description: "Every id should be unique across the catalogue."
            businessImpact: operational

      - name: code
        logicalType: string
        logicalTypeOptions:
          minLength: 1
          maxLength: 64
          pattern: "^[A-Z0-9-]+$"
          format: code
        physicalType: VARCHAR(64)
        required: true
        unique: true
        classification: public
        criticalDataElement: true
        description: "Short uppercase code."
        examples:
          - "AFRH"
          - "DHS"
          - "DHS - FEMA"
        quality:
          - type: library
            dimension: conformity
            metric: invalidValues
            description: "code must match ^[A-Z0-9-]+$ pattern."
            mustBe: 0
            severity: warning
        relationships:
          - to: CoverageRef.code
            type: foreignKey
            customProperties:
              - property: cardinality
                value: many-to-one

      # Number / float
      - name: latitude
        logicalType: number
        logicalTypeOptions:
          format: f64
          multipleOf: 0.000001
          minimum: -90
          maximum: 90
        physicalType: DOUBLE PRECISION
        required: false
        classification: public
        criticalDataElement: false
        description: "Latitude in WGS84 decimal degrees."
        examples:
          - 38.9072
          - -33.8688
        quality:
          - type: library
            dimension: accuracy
            metric: invalidValues
            description: "latitude must be in [-90, 90]."
            mustBe: 0

      - name: longitude
        logicalType: number
        logicalTypeOptions:
          format: f64
          multipleOf: 0.000001
          minimum: -180
          maximum: 180
        physicalType: DOUBLE PRECISION
        required: false
        classification: public
        criticalDataElement: false
        description: "Longitude in WGS84 decimal degrees."
        examples:
          - -77.0369
          - 151.2093

      # Date (DateTimeFormatter)
      - name: eventDate
        logicalType: date
        logicalTypeOptions:
          format: "yyyy-MM-dd"
          minimum: "1900-01-01"
          maximum: "2100-12-31"
        physicalType: DATE
        required: false
        classification: public
        description: "Event date (ISO 8601 calendar date)."
        examples:
          - "2025-08-07"

      # Timestamp (timezone-aware)
      - name: eventTimestamp
        logicalType: timestamp
        logicalTypeOptions:
          format: "yyyy-MM-dd'T'HH:mm:ss[.SSS]XXX"
          timezone: true
          defaultTimezone: "Etc/UTC"
          minimum: "1900-01-01T00:00:00Z"
          maximum: "2100-12-31T23:59:59Z"
        physicalType: TIMESTAMP WITH TIME ZONE
        required: false
        classification: public
        description: "Event timestamp with timezone."
        examples:
          - "2025-08-07T14:23:11.123Z"

      # Time-of-day
      - name: eventTime
        logicalType: time
        logicalTypeOptions:
          format: "HH:mm:ss"
        physicalType: TIME
        required: false
        classification: public
        description: "Event time-of-day (ISO 8601)."

      # Boolean
      - name: isActive
        logicalType: boolean
        physicalType: BOOLEAN
        required: false
        classification: public
        description: "Active flag."
        examples:
          - true
          - false

      # Array (with logicalTypeOptions for maxItems, uniqueItems)
      - name: tagsArray
        logicalType: array
        logicalTypeOptions:
          maxItems: 32
          minItems: 0
          uniqueItems: true
        items:
          name: tag
          logicalType: string
          logicalTypeOptions:
            minLength: 1
            maxLength: 64
          required: true
          description: "Single tag."
        physicalType: TEXT[]
        required: false
        classification: public
        description: "Tag array."
        examples:
          - ["alpha", "beta"]

      # Nested object (with required[] and maxProperties)
      - name: nestedObject
        logicalType: object
        logicalTypeOptions:
          maxProperties: 8
          minProperties: 1
          required:
            - inner_id
        physicalType: JSONB
        required: false
        classification: public
        description: "Nested object."
        examples:
          - {
              "inner_id": 1,
              "value": "x"
            }
        properties:
          - name: inner_id
            logicalType: integer
            required: true
            description: "Inner id."
          - name: value
            logicalType: string
            required: false
            description: "Inner value."

    # Object-level quality (different from per-property)
    quality:
      - type: library
        dimension: coverage
        metric: rowCount
        description: "CoverageObject must contain at least one row in production."
        mustBeGreaterThan: 0
        severity: error
    # Object-level relationships
    relationships:
      - from: CoverageObject.id
        to: CoverageRef.code
        type: foreignKey
        customProperties:
          - property: cardinality
            value: one-to-one

  # ── Object #2: minimal, to exercise an object with no quality at all ──────
  - name: CoverageRef
    physicalName: coverage_ref
    logicalType: object
    description: "Lookup reference object."
    properties:
      - name: code
        primaryKey: true
        primaryKeyPosition: 1
        logicalType: string
        logicalTypeOptions:
          minLength: 1
          maxLength: 64
        physicalType: VARCHAR(64)
        required: true
        unique: true
        description: "Reference code (FK target)."

# ── Support channels — exercise every `tool` enum value ─────────────────────
