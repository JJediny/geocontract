  - channel: permits@innovation.gov
    tool: email
    url: "mailto:permits@innovation.gov"
    description: "Email support."
  - channel: "#permits-pic"
    tool: slack
    url: "https://slack.com/app_redirect?channel=permits-pic"
    description: "Slack channel."
  - channel: permits-pic-teams
    tool: teams
    url: "https://teams.microsoft.com/l/channel/permits-pic"
    description: "MS Teams channel."
  - channel: permits-pic-discord
    tool: discord
    url: "https://discord.com/channels/permits-pic"
    description: "Discord server."
  - channel: permits-pic-issues
    tool: ticket
    url: "https://github.com/JJediny/geocontract/issues"
    description: "GitHub issue tracker."
  - channel: permits-pic-googlechat
    tool: googlechat
    url: "https://chat.google.com/room/permits-pic"
    description: "Google Chat space."
  - channel: other-channel
    tool: other
    url: "https://example.gov/permits-pic"
    description: "Other channel."

# ── Pricing ────────────────────────────────────────────────────────────────
price:
  priceCurrency: USD
  priceAmount: 0.00
  priceUnit: dataset

# ── Team ──────────────────────────────────────────────────────────────────
team:
  id: team-permits-pic
  name: Permitting Innovation Center
  description: "Cross-agency federal team responsible for the geocontract."
  tags:
    - geocontract
    - permits-pic
  members:
    - id: member-owner
      username: permits@innovation.gov
      name: Permitting Innovation Center
      description: Publishing team owner.
      role: owner
      dateIn: "2024-01-01"
      tags:
        - owner
        - publishes
      customProperties:
        - property: gsaRole
          value: PIC Lead
    - id: member-steward
      username: jj@example.gov
      name: J. Jediny
      description: Data steward for geocontract.
      role: steward
      dateIn: "2024-06-01"
      dateOut: "2026-06-01"
      replacedByUsername: next-steward@example.gov
      tags:
        - steward
  customProperties:
    - property: gsaOffice
      value: "Permitting Innovation Center"
  authoritativeDefinitions:
    - url: "https://permitting.innovation.gov/"
      type: documentation
      description: "PIC programme page."

# ── Roles (IAM) ───────────────────────────────────────────────────────────
roles:
  - id: role-public
    role: Public
    description: "Anonymous read access."
    access: read
  - id: role-editor
    role: NEPAEditor
    description: "Editor role with write access."
    access: write
    firstLevelApprovers: PIC-Steward
    secondLevelApprovers: PIC-Director
  - id: role-admin
    role: NEPAAdmin
    description: "Admin role with full access."
    access: read-write-delete
    firstLevelApprovers: PIC-Director
    secondLevelApprovers: GSA-OCSO

# ── SLA: contract-wide default element ────────────────────────────────────
slaDefaultElement: "freshness"

# ── SLA: per-property SLAs (full key set) ─────────────────────────────────
# Note: ServiceLevelAgreementProperty has additionalProperties=false,
# so structured threshold metadata belongs in customProperties at the
# top-level DataContract or per-CoverageObject, not here.
slaProperties:
  - id: sla-freshness
    property: freshness
    value: "<= 30 days since last_updated"
    # valueExt is a scalar per ODCS (string|number|integer|boolean|null).
    valueExt: 30
    unit: days
    element: lastUpdated
    driver: operational
    description: "Records must be refreshed at least every 30 days."
    scheduler: cron
    schedule: "0 6 * * *"
  - id: sla-latency
    property: latency
    value: "p95 < 250ms"
    valueExt: 250
    unit: ms
    element: "*"
    driver: analytics
    description: "API p95 latency budget for read paths."
    scheduler: cron
    schedule: "*/5 * * * *"
  - id: sla-availability
    property: availability
    value: "99.9%"
    valueExt: 99.9
    unit: percent
    driver: regulatory
    description: "Monthly availability budget (≈43 min downtime / month)."
    scheduler: cron
    schedule: "*/5 * * * *"

# ── Authoritative definitions (top-level) ──────────────────────────────────
authoritativeDefinitions:
  - id: def-odcs
    url: "https://bitol-io.github.io/open-data-contract-standard/"
    type: documentation
    description: "ODCS v3.1.0 canonical specification."
  - id: def-datacontract
    url: "https://datacontract.com/"
    type: documentation
    description: "datacontract.com homepage."
  - id: def-jsonschema-x-graphql
    url: "https://github.com/json-schema-x-graphql/json-schema-x-graphql"
    type: sourceCode
    description: "json-schema-x-graphql upstream project."
  - id: def-pic
    url: "https://github.com/permits/pyper/tree/main/pic-standards"
    type: sourceCode
    description: "PIC NEPA Data Standard upstream project."

# ── Custom properties (top-level) ──────────────────────────────────────────
customProperties:
  - property: geocontractTier
    value: reference
    description: "Marks this as the full-coverage reference contract."
  - property: geocontractPrimitivesCovered
    value: 100
    description: "Percentage of ODCS primitives exercised by this file."
  - property: geocontractSchemaVersion
    value: v3.1.0
  - property: x-graphql-federation-keys
    value: "id"
    description: "Bridge to json-schema-x-graphql metadata."
  - property: x-graphql-field-strategy
    value: GRAPHQL_IDIOMATIC
    description: "Field-name case strategy for downstream SDL conversion."

# ── Creation timestamp ────────────────────────────────────────────────────
contractCreatedTs: "2026-08-24T00:00:00Z"
