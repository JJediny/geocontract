        criticalDataElement: false
        description: "Bottom-right longitude of bounding box."
      - name: purpose
        logicalType: string
        physicalType: VARCHAR(512)
        required: false
        classification: public
        criticalDataElement: false
        description: "Purpose of the GIS data element."
      - name: dataMatch
        logicalType: boolean
        physicalType: BOOLEAN
        required: false
        classification: internal
        criticalDataElement: false
        description: "Whether the data matches expected values."
      - name: accessInfo
        logicalType: string
        physicalType: VARCHAR(2048)
        required: false
        classification: public
        criticalDataElement: false
        description: "Additional access information."
      - name: createdAt
        logicalType: timestamp
        logicalTypeOptions: { format: "yyyy-MM-dd'T'HH:mm:ssXXX", timezone: true, defaultTimezone: "Etc/UTC" }
        physicalType: TIMESTAMP WITH TIME ZONE
        required: false
        classification: internal
        criticalDataElement: false
        description: "Created timestamp."
      - name: parentGis
