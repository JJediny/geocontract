support:
  - channel: url
    url: "https://permitting.innovation.gov/resources/data-standard/"
  - channel: email
    url: "mailto:permits@innovation.gov"

price:
  priceCurrency: USD
  priceAmount: 0.00
  priceUnit: dataset

team:
  name: Permitting Innovation Center
  description: |
    Cross-agency federal team responsible for the NEPA Data Standard.
  members:
    - username: permits@innovation.gov
      name: Permitting Innovation Center
      role: owner
      description: Publishing team
      dateIn: "2024-01-01"

roles:
  - role: Public
    description: Anonymous read access.
    access: read
  - role: NEPAEditor
    description: NEPA editing role.
    access: write

slaProperties:
  - property: availability
    value: "99.5%"
    unit: percent
    driver: operational
    description: |
      Reference SQL DDL, JSON samples, OpenAPI, and YAML samples must
      be available 99.5% of the time per calendar month.
    scheduler: cron
    schedule: "*/5 * * * *"
  - property: freshness
    value: "180d"
    unit: days
    driver: regulatory
    description: |
      The standard must be republished at least every 180 days;
      breaking changes follow semantic versioning.

authoritativeDefinitions:
  - url: "https://permitting.innovation.gov/resources/data-standard/"
    type: glossary
    description: "NEPA Data Standard reference page."

customProperties:
  - property: geocontract.source
    value: "https://github.com/permits/pyper/tree/main/pic-standards/src/jsonschema/nepa.schema.json"
  - property: geocontract.entityCount
    value: 13
  - property: geocontract.jsonSchema
    value: "templates/pic-standards.template.schema.json"
  - property: geocontract.graphqlSubgraph
    value: "models/pic-standards.canonical.graphql"
  - property: geocontract.fieldMapping
    value: "maps/pic-standards.field-mapping.json"
  - property: x-graphql-federation-keys
    value: "id"
  - property: pic-standards.topLevelContainer
    value: "processe_instances"
  - property: pic-standards.v1.2ProvenanceProperties
    value: "data_record_version,data_source_agency,data_source_system,last_updated,record_owner_agency,retrieved_timestamp"

contractCreatedTs: "2026-08-24T00:00:00Z"
